[project]
name = "postgear-media"
version = "0.1.0"
description = "PostGear's media service: sound and pictures for Clips AI, as Temporal activities."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.163,<0.164",
  "uvicorn>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "temporalio>=1.36,<2",
  "boto3>=1.44,<2",
  "httpx>=0.28,<0.29",
  "structlog>=26.1",
]

[dependency-groups]
dev = [
  "ruff>=0.17.5",
  "mypy>=2.4,<3",
  "pytest>=9.2,<10",
  "datamodel-code-generator>=0.96",
  "boto3-stubs[s3]>=1.44",
  "httpx2>=2.16.2",
  "numpy>=2.2",
]
# Model libraries for real runs (Modules 02, 06, 07). Simulation, lint, type
# check and tests never need them; `uv sync --group ml` installs them.
# No PyTorch: faster-whisper runs on CTranslate2 and decodes sound with PyAV.
ml = [
  "faster-whisper>=1.2.1,<2",
  # Module 06: the picture decoder and the motion measure. One OpenCV build only
  # (research 02, section 6.1); the headless one needs no system graphics.
  "opencv-python-headless>=4.10,<6",
  "numpy>=2.2,<3",
  # Module 07: the face detector (Tasks API, short-range BlazeFace). Its model
  # file is never fetched by code: it lives in MEDIA_MODEL_DIR (Module 15).
  "mediapipe>=1.2.3,<1.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgear_media"]

[tool.uv]
default-groups = ["dev"]
# One OpenCV build only (research 02, section 6.1): MediaPipe asks for the
# desktop contrib build, which would install a second `cv2` over the headless
# one. The real face check decides whether the contrib headless build is needed.
exclude-dependencies = ["opencv-contrib-python", "opencv-python"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/postgear_media/contract/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL", "T20", "BLE", "ARG"]
ignore = ["PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["postgear_media", "tests"]
exclude = ["build/"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mediapipe", "mediapipe.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["postgear_media.contract.generated"]
disable_error_code = ["misc"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "ml: needs the ml group (skipped unless it is installed)",
  "temporal: needs a Temporal server on TEMPORAL_HOST (skipped when it cannot be reached)",
  "voice: runs the real voice program (skipped unless it and the Kokoro files are on this box)",
]
