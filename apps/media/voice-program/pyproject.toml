[project]
name = "postgear-voice"
version = "0.1.0"
description = "PostGear's voice program: one typed line in, one spoken WAV's samples out, through Kokoro. Its own program, never imported by the media service."
readme = "README.md"
# kokoro-onnx loads espeak-ng (GPL-3.0) inside this process, so this small
# program is GPL-3.0-or-later too. The media service only runs it as a separate
# program (a file in, a file out), as research 02 and the Decision Log say.
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
  "kokoro-onnx==0.6.1",
  "numpy>=2.2,<3",
  # onnxruntime 1.24 and later ship no Intel Mac build; 1.23.2 is the last one.
  "onnxruntime>=1.23.2,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "onnxruntime>=1.23.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
postgear-voice = "postgear_voice.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgear_voice"]
