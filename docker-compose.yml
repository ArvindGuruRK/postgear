services:
  postgres:
    image: postgres:15-alpine
    container_name: postgear_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgear_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Temporal's auto-setup needs a reachable database the moment it starts,
    # so the dependency below waits on this rather than on the container merely
    # existing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgear_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: postgear_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: postgear_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # One-shot bucket setup for MinIO (Sprint 12, Module 02). Runs on every
  # `docker compose up`, changes nothing when the buckets are already right,
  # then exits.
  #
  # - postgear-media: the public space. Anonymous GetObject on its objects only,
  #   the same policy it had before (no anonymous listing, so a key stays
  #   unguessable). The Clips catalogue lives under its `library/` prefix
  #   (immutable files, uploaded with `Cache-Control: public, max-age=31536000,
  #   immutable`); an empty `library/.keep` makes the prefix show in the console.
  #   Production applies the same read policy to `library/*` on its public bucket.
  # - postgear-clips: the private Clips space. No anonymous access at all;
  #   browsers reach it only through presigned URLs that expire.
  # - CORS on both for the web app at http://localhost:3000: GET, HEAD and PUT
  #   (browser part uploads), any request header (so Range), and Content-Range,
  #   Accept-Ranges, Content-Length and ETag exposed for the players and uploads.
  #   The community MinIO build refuses bucket CORS ("not implemented") and
  #   answers CORS server-wide instead (`api cors_allow_origin`, `*` by
  #   default, exposing those headers), so that step is best effort here; R2
  #   and AWS S3 take the same rule as a bucket CORS setting in production.
  minio-setup:
    image: minio/mc
    container_name: postgear_minio_setup
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        tries=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ls local >/dev/null 2>&1; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 60 ]; then
            echo "minio-setup: MinIO did not answer within 60 seconds" >&2
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing local/postgear-media
        mc mb --ignore-existing local/postgear-clips
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::postgear-media/*"]}]}' > /tmp/public-read.json
        mc anonymous set-json /tmp/public-read.json local/postgear-media
        mc anonymous set none local/postgear-clips
        printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>http://localhost:3000</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>Content-Range</ExposeHeader><ExposeHeader>Accept-Ranges</ExposeHeader><ExposeHeader>Content-Length</ExposeHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' > /tmp/cors.xml
        if mc cors set local/postgear-media /tmp/cors.xml >/dev/null 2>&1 && mc cors set local/postgear-clips /tmp/cors.xml >/dev/null 2>&1; then
          echo "minio-setup: bucket CORS set for http://localhost:3000"
        else
          echo "minio-setup: this MinIO has no bucket CORS; its server-wide CORS (api cors_allow_origin, * by default) already covers http://localhost:3000"
        fi
        mc stat local/postgear-media/library/.keep >/dev/null 2>&1 || printf '' | mc pipe local/postgear-media/library/.keep
        echo "minio-setup: postgear-media (public read) and postgear-clips (private) are ready"

  # Temporal (Sprint 5): the durable scheduler behind every queued post.
  #
  # `auto-setup` creates and migrates its own two databases (`temporal` and
  # `temporal_visibility`) inside the Postgres above, so the stack stays at one
  # database server. Visibility is SQL-backed: PostGear derives every workflow
  # id from a row id (packages/scheduling), so it never searches by attribute
  # and does not need Elasticsearch.
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: postgear_temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  # The Temporal web UI, at http://localhost:8233: every scheduled post is a
  # workflow you can open, with its timers, retries and signals laid out.
  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: postgear_temporal_ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:
