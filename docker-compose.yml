services:
  postgres:
    image: postgres:15-alpine
    container_name: postgear_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgear_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Temporal's auto-setup needs a reachable database the moment it starts,
    # so the dependency below waits on this rather than on the container merely
    # existing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgear_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: postgear_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: postgear_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Temporal (Sprint 5): the durable scheduler behind every queued post.
  #
  # `auto-setup` creates and migrates its own two databases (`temporal` and
  # `temporal_visibility`) inside the Postgres above, so the stack stays at one
  # database server. Visibility is SQL-backed: PostGear derives every workflow
  # id from a row id (packages/scheduling), so it never searches by attribute
  # and does not need Elasticsearch.
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: postgear_temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  # The Temporal web UI, at http://localhost:8233: every scheduled post is a
  # workflow you can open, with its timers, retries and signals laid out.
  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: postgear_temporal_ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:
