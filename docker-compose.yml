services:
  postgres:
    image: postgres:15-alpine
    container_name: postgear_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgear_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Temporal's auto-setup needs a reachable database the moment it starts,
    # so the dependency below waits on this rather than on the container merely
    # existing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgear_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: postgear_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: postgear_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # The buckets (postgear-media public read, postgear-clips private, CORS) are
  # created over the S3 API by `npm run storage:buckets` (scripts/ensure-buckets.ts),
  # which `npm run dev` runs after this file starts. MinIO stopped publishing its
  # `minio/mc` image, so no setup container is used any more.

  # Temporal (Sprint 5): the durable scheduler behind every queued post.
  #
  # `auto-setup` creates and migrates its own two databases (`temporal` and
  # `temporal_visibility`) inside the Postgres above, so the stack stays at one
  # database server. Visibility is SQL-backed: PostGear derives every workflow
  # id from a row id (packages/scheduling), so it never searches by attribute
  # and does not need Elasticsearch.
  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: postgear_temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  # The Temporal web UI, at http://localhost:8233: every scheduled post is a
  # workflow you can open, with its timers, retries and signals laid out.
  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: postgear_temporal_ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  # The real worker image (Sprint 12, Module 20: infra/docker/Dockerfile.worker),
  # run against the services above to prove the image imports and exports.
  # Never started by a plain `docker compose up`: it has its own profile.
  #
  #   docker compose --profile worker-image up --build worker
  #
  # Stop the local worker (`npm run dev:worker`) first, or two workers poll the
  # same queues. The API stays on the host (`npm run dev:api`): the worker
  # calls it at host.docker.internal:3001. Settings come from the root .env,
  # like the local worker, with the addresses changed to these services and
  # the image's own programs and folders kept whatever the .env says. Local
  # storage is shared with the host API by mounting its two upload folders;
  # the sample videos are mounted read only for CLIPS_SIMULATION. On a Linux
  # host the mounted folders must be writable by uid 10001 (the image's user).
  worker:
    profiles: ["worker-image"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    image: postgear-worker:local
    container_name: postgear_worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgear_db?schema=public
      REDIS_URL: redis://redis:6379
      TEMPORAL_HOST: temporal:7233
      S3_ENDPOINT: http://minio:9000
      API_URL: http://host.docker.internal:3001
      UPLOAD_DIRECTORY: /app/apps/api/uploads
      FFMPEG_PATH: /opt/postgear/bin/ffmpeg
      FFPROBE_PATH: /opt/postgear/bin/ffprobe
      YTDLP_PATH: /opt/postgear/bin/yt-dlp
      YTDLP_JS_RUNTIME: /opt/postgear/bin/deno
      CLIPS_FONTS_DIR: /usr/share/postgear-fonts
      CLIPS_SCRATCH_DIR: /var/lib/postgear/scratch
      FONTCONFIG_FILE: /etc/fonts/postgear-fonts.conf
      # This local image never publishes, fetches a video or calls a paid model
      # for real, whatever .env says (the local .env keeps PUBLISH_SIMULATION
      # false for the host worker). The WORKER_IMAGE_* names are not in .env, so
      # these stay true unless set in the shell on purpose.
      PUBLISH_SIMULATION: "${WORKER_IMAGE_PUBLISH_SIMULATION:-true}"
      ANALYTICS_SIMULATION: "${WORKER_IMAGE_ANALYTICS_SIMULATION:-true}"
      CLIPS_SIMULATION: "${WORKER_IMAGE_CLIPS_SIMULATION:-true}"
      AI_SIMULATION: "${WORKER_IMAGE_AI_SIMULATION:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - worker_scratch:/var/lib/postgear/scratch
      - ./apps/api/uploads:/app/apps/api/uploads
      - ./apps/api/uploads-private:/app/apps/api/uploads-private
      - ./packages/media-tools/samples:/app/packages/media-tools/samples:ro
    stop_grace_period: 1m
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  worker_scratch:
