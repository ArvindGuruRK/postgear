<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  fontconfig for the worker image (FONTCONFIG_FILE). The static FFmpeg's
  libass asks fontconfig only for a last fallback: the fonts an export uses
  are copied into its own scratch folder and passed as `fontsdir`, and any
  face libass picks outside that plan fails the export with font_missing.
  So this lists only the last-resort fonts: Noto Sans (Latin) and the
  one-colour Noto Emoji. The render twins are deliberately not listed here.
-->
<fontconfig>
  <dir>/usr/share/postgear-fonts/system</dir>
  <!-- Built into the image at build time; /tmp is used if the image is read only and the cache is stale. -->
  <cachedir>/var/cache/postgear-fontconfig</cachedir>
  <cachedir>/tmp/postgear-fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
